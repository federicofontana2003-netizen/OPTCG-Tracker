<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPTCG CLOUD - FEDERICO</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        :root { --primary: #c62828; --gold: #f59e0b; --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --border: #334155; --danger: #ef4444; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); color: var(--text); }
        
        /* Protezione Accesso */
        #lock-screen { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .lock-box { background: var(--card); padding: 30px; border-radius: 15px; border: 2px solid var(--primary); text-align: center; width: 320px; }
        
        .container { max-width: 1000px; margin: auto; padding: 15px; display: none; }
        header { text-align: center; border-bottom: 2px solid var(--primary); padding-bottom: 10px; margin-bottom: 20px; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 15px; border: none; background: #334155; color: white; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .tab-btn.active { background: var(--primary); box-shadow: 0 0 10px var(--primary); }
        
        .page { display: none; background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); }
        .page.active { display: block; }
        
        input, select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid var(--border); background: #0b1120; color: white; box-sizing: border-box; font-size: 1rem; }
        .btn-save { background: var(--primary); color: white; border: none; padding: 18px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; font-size: 1.1rem; margin-top: 10px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
        th { color: var(--gold); font-size: 0.9rem; text-transform: uppercase; }
        .win { color: #22c55e; font-weight: bold; }
        .loss { color: #ef4444; font-weight: bold; }
        .del-btn { background: none; border: 1px solid var(--danger); color: var(--danger); padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.7rem; }
        
        .sync-indicator { font-size: 0.7rem; text-align: center; color: #94a3b8; margin-top: 10px; }
    </style>
</head>
<body>

<div id="lock-screen">
    <div class="lock-box">
        <h2 style="color:var(--gold); margin-top:0;">OPTCG CLOUD</h2>
        <p id="lock-msg" style="font-size:0.8rem; color:#94a3b8;">Inserisci la password per connetterti al database</p>
        <input type="password" id="psw" placeholder="Password...">
        <button class="btn-save" onclick="checkAuth()">SBLOCCA</button>
    </div>
</div>

<div id="app" class="container">
    <header><h1>🏆 CLOUD TRACKER</h1></header>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('add', this)">INSERISCI</button>
        <button class="tab-btn" onclick="openTab('list', this)">STORICO</button>
        <button class="tab-btn" onclick="openTab('stats', this)">STATISTICHE</button>
    </div>

    <div id="add" class="page active">
        <label>Il Tuo Leader</label>
        <select id="myLader"></select>
        <label>Leader Avversario</label>
        <select id="oppLeader"></select>
        <div style="display:flex; gap:10px;">
            <select id="turn"><option value="1st">1st Turn</option><option value="2nd">2nd Turn</option></select>
            <select id="result"><option value="Win">VITTORIA</option><option value="Loss">SCONFITTA</option></select>
        </div>
        <button class="btn-save" onclick="saveToCloud()">SALVA NEL CLOUD</button>
        <p class="sync-indicator" id="status">Sincronizzato con Firebase</p>
    </div>

    <div id="list" class="page">
        <div style="overflow-x:auto;">
            <table>
                <thead><tr><th>Data</th><th>Match</th><th>Esito</th><th>Azione</th></tr></thead>
                <tbody id="matchLog"></tbody>
            </table>
        </div>
    </div>

    <div id="stats" class="page">
        <div style="overflow-x:auto;">
            <table>
                <thead><tr><th>Leader</th><th>W/L</th><th>Win Rate</th></tr></thead>
                <tbody id="statTable"></tbody>
            </table>
        </div>
        <button class="btn-save" style="background:#475569; margin-top:30px;" onclick="doLogout()">LOGOUT</button>
    </div>
</div>

<script>
    // Configurazione Firebase Federico
    const firebaseConfig = {
        apiKey: "AIzaSyCLoFyNXaHvtbnCfH40o8qqwjy0RO95NgQ",
        authDomain: "optcg-tracker-225de.firebaseapp.com",
        projectId: "optcg-tracker-225de",
        storageBucket: "optcg-tracker-225de.firebasestorage.app",
        messagingSenderId: "397158081205",
        appId: "1:397158081205:web:8d5b5385df720d1aaad4fc",
        databaseURL: "https://optcg-tracker-225de-default-rtdb.europe-west1.firebasedatabase.app"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let allMatches = [];

    // Sicurezza
    function checkAuth() {
        const p = document.getElementById('psw').value;
        const saved = localStorage.getItem('master_key');
        if(!saved) {
            if(p.length < 4) return alert("Minimo 4 caratteri");
            localStorage.setItem('master_key', p);
            enterApp();
        } else if(p === saved) {
            enterApp();
        } else {
            alert("Sbagliata!");
        }
    }

    function enterApp() {
        sessionStorage.setItem('auth_ok', 'true');
        document.getElementById('lock-screen').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        startSync();
    }

    function doLogout() {
        sessionStorage.clear();
        location.reload();
    }

    // Caricamento Dati
    function startSync() {
        db.ref('matches').on('value', (snapshot) => {
            const data = snapshot.val();
            allMatches = data ? Object.entries(data).map(([id, val]) => ({id, ...val})) : [];
            renderAll();
            document.getElementById('status').innerText = "Dati aggiornati in tempo reale";
        });
    }

    function saveToCloud() {
        const match = {
            p1: document.getElementById('myLader').value,
            p2: document.getElementById('oppLeader').value,
            t: document.getElementById('turn').value,
            r: document.getElementById('result').value,
            date: new Date().toLocaleDateString()
        };
        db.ref('matches').push(match);
        alert("Inviato al database di Google!");
    }

    function deleteMatch(id) {
        if(confirm("Vuoi cancellare questo match?")) {
            db.ref('matches/' + id).remove();
        }
    }

    function renderAll() {
        // Storico
        const log = document.getElementById('matchLog');
        log.innerHTML = allMatches.slice().reverse().map(m => `
            <tr>
                <td style="font-size:0.7rem">${m.date}</td>
                <td style="font-size:0.8rem"><b>${m.p1.split(' ')[0]}</b> vs ${m.p2.split(' ')[0]}</td>
                <td class="${m.r === 'Win' ? 'win' : 'loss'}">${m.r}</td>
                <td><button class="del-btn" onclick="deleteMatch('${m.id}')">X</button></td>
            </tr>
        `).join('');

        // Statistiche
        const statTable = document.getElementById('statTable');
        let summary = {};
        allMatches.forEach(m => {
            if(!summary[m.p1]) summary[m.p1] = {w:0, l:0};
            m.r === 'Win' ? summary[m.p1].w++ : summary[m.p1].l++;
        });
        
        statTable.innerHTML = Object.entries(summary).sort((a,b)=>b[1].w - a[1].w).map(([name, s]) => {
            const wr = (s.w / (s.w+s.l) * 100).toFixed(1);
            return `<tr><td>${name.split(' ')[0]}</td><td>${s.w}-${s.l}</td><td class="win">${wr}%</td></tr>`;
        }).join('');
    }

    function openTab(id, btn) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
    }

    const leaders = ["Edward.Newgate (OP02-001)", "Portgas.D.Ace (OP03-001)", "Shanks (OP09-001)", "Enel (OP05-098)", "Rob Lucci (OP07-079)", "Bonney (OP07-019)", "Boa Hancock (OP07-038)", "Trafalgar Law (ST10-001)", "Doflamingo (OP01-060)", "Katakuri (OP03-099)", "Yamato (OP06-022)", "Nami (OP03-040)"].sort();
    
    window.onload = () => {
        const s1 = document.getElementById('myLader');
        const s2 = document.getElementById('oppLeader');
        leaders.forEach(l => {
            s1.add(new Option(l, l));
            s2.add(new Option(l, l));
        });
        if(sessionStorage.getItem('auth_ok') === 'true') enterApp();
    };
</script>
</body>
</html>
