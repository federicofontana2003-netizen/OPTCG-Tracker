<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPTCG SECURE ANALYTICS</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        :root { 
            --primary: #c62828; --gold: #f59e0b; --bg: #0f172a; 
            --card: #1e293b; --text: #f1f5f9; --border: #334155; 
            --danger: #b91c1c; --secondary: #475569; --success: #16a34a;
        }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); color: var(--text); line-height: 1.5; }
        
        /* Overlay di Sicurezza */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); display: flex; align-items: center; justify-content: center;
            z-index: 10000; flex-direction: column; padding: 20px;
        }
        .login-box { background: var(--card); padding: 30px; border-radius: 15px; border: 2px solid var(--primary); width: 100%; max-width: 350px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .login-input { width: 80%; padding: 12px; margin: 15px 0; border-radius: 6px; border: 1px solid var(--border); background: #0b1120; color: white; text-align: center; font-size: 1.2rem; }

        .container { max-width: 1200px; margin: auto; padding: 15px; display: none; }
        header { text-align: center; border-bottom: 2px solid var(--primary); padding-bottom: 10px; margin-bottom: 15px; }
        h1 { color: var(--gold); margin: 0; font-size: 1.6rem; }
        .main-tabs, .sub-tabs { display: flex; gap: 8px; margin-bottom: 15px; background: rgba(0,0,0,0.4); padding: 10px; border-radius: 10px; overflow-x: auto; }
        .sub-tabs { background: #1e293b; justify-content: center; border: 1px solid var(--border); }
        .tab-btn, .sub-btn { flex: 1; padding: 12px; border: none; background: #334155; color: white; font-weight: bold; cursor: pointer; border-radius: 6px; white-space: nowrap; }
        .tab-btn.active { background: var(--primary); }
        .sub-btn { flex: 0 1 200px; background: #475569; font-size: 0.85rem; }
        .sub-btn.active { background: var(--gold); color: #0f172a; }
        .page { display: none; background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); }
        .page.active { display: block; }
        .table-container { overflow-x: auto; margin-top: 15px; border: 1px solid var(--border); border-radius: 8px; background: #0b1120; }
        table { width: 100%; border-collapse: collapse; min-width: 500px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
        th { background: #1e293b; color: var(--gold); text-transform: uppercase; }
        .analysis-layout { display: flex; gap: 20px; flex-wrap: wrap; }
        .analysis-sidebar { width: 100%; max-width: 300px; background: #0b1120; padding: 15px; border-radius: 8px; height: 400px; overflow-y: auto; border: 1px solid var(--border); }
        .analysis-main { flex: 1; min-width: 300px; }
        .leader-item { padding: 10px; cursor: pointer; border-radius: 4px; margin-bottom: 6px; font-size: 0.8rem; background: #1e293b; border-left: 4px solid transparent; }
        .leader-item.selected { background: var(--primary); border-left-color: var(--gold); }
        .stat-grid { display: flex; gap: 10px; margin-bottom: 20px; }
        .stat-box { background: #0f172a; padding: 10px; border-radius: 8px; flex: 1; text-align: center; border: 1px solid var(--border); }
        .stat-box p { font-size: 1.2rem; font-weight: bold; margin: 5px 0 0 0; color: var(--gold); }
        .btn-main { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
        .wr-high { color: #34d399; } .wr-low { color: #f87171; }
        .admin-zone { margin-top: 30px; padding-top: 20px; border-top: 1px dashed var(--border); }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <h2 id="login-status" style="color: var(--gold);">SICUREZZA</h2>
        <p id="login-desc" style="font-size: 0.8rem; color: #94a3b8;">Inserisci la password per sbloccare il cloud.</p>
        <input type="password" id="psw-field" class="login-input" placeholder="Password...">
        <button class="btn-main" onclick="validate()">SBLOCCA</button>
    </div>
</div>

<div id="app" class="container">
    <header><h1>🏴‍☠️ OPTCG ANALYTICS CLOUD</h1></header>

    <div class="main-tabs">
        <button class="tab-btn active" onclick="setMainTab('insert', this)">INSERIMENTO</button>
        <button class="tab-btn" onclick="setMainTab('stats', this)">DATABASE</button>
        <button class="tab-btn" onclick="setMainTab('ranking', this)">TOP 10</button>
        <button class="tab-btn" onclick="setMainTab('analysis', this)">ANALISI</button>
    </div>

    <div class="sub-tabs">
        <button class="sub-btn active" onclick="setFormat('standard', this)">STANDARD</button>
        <button class="sub-btn" onclick="setFormat('eterno', this)">ETERNO</button>
    </div>

    <div id="insert" class="page active">
        <div style="max-width:500px; margin:auto;">
            <h3 id="formato-label" style="color:var(--gold); text-align:center;">MODALITÀ: STANDARD</h3>
            <div><label>Tuo Leader (P1)</label><select id="deck1" class="leader-select" style="width:100%; padding:12px; margin:5px 0 15px 0; background:#0b1120; color:white; border-radius:6px;"></select></div>
            <div><label>Avversario (P2)</label><select id="deck2" class="leader-select" style="width:100%; padding:12px; margin:5px 0 15px 0; background:#0b1120; color:white; border-radius:6px;"></select></div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px; margin-bottom:20px;">
                <div><label>Turno P1</label><select id="turn" style="width:100%; padding:12px; background:#0b1120; color:white;"><option value="1st">1st</option><option value="2nd">2nd</option></select></div>
                <div><label>Esito P1</label><select id="result" style="width:100%; padding:12px; background:#0b1120; color:white;"><option value="Win">Win</option><option value="Loss">Loss</option></select></div>
            </div>
            <button class="btn-main" onclick="saveMatch()">SALVA SUL CLOUD</button>

            <div class="admin-zone">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                    <button class="sub-btn" onclick="doLogout()" style="background:#475569;">🔒 LOGOUT</button>
                    <button class="sub-btn" onclick="resetData()" style="background:var(--danger);">RESET DATI</button>
                </div>
                <p id="sync-status" style="text-align:center; font-size:0.7rem; margin-top:10px; color:#64748b;">Sincronizzato con Firebase</p>
            </div>
        </div>
    </div>

    <div id="stats" class="page"><div class="table-container"><table><thead><tr><th>Leader</th><th>W-L</th><th>WR%</th><th>1st</th><th>2nd</th></tr></thead><tbody id="statsBody"></tbody></table></div></div>
    <div id="ranking" class="page"><div class="table-container"><table><thead><tr><th>#</th><th>Leader</th><th>Match</th><th>WR%</th><th>1st</th><th>2nd</th></tr></thead><tbody id="rankingBody"></tbody></table></div></div>
    <div id="analysis" class="page">
        <div class="analysis-layout">
            <div class="analysis-sidebar">
                <input type="text" id="search-an" placeholder="Cerca..." onkeyup="filterAnList()" style="width:100%; padding:10px; margin-bottom:10px; background:#1e293b; color:white; border:1px solid #334155;">
                <div id="analysis-list"></div>
            </div>
            <div class="analysis-main">
                <div id="an-placeholder" style="text-align:center; padding-top:50px; color:#64748b;"><h3>Seleziona Leader</h3></div>
                <div id="an-content" style="display:none;">
                    <h2 id="an-title" style="color:var(--gold); margin:0 0 15px 0;">-</h2>
                    <div class="stat-grid"><div class="stat-box"><h4>Tot</h4><p id="an-total">-</p></div><div class="stat-box"><h4>1st</h4><p id="an-1st">-</p></div><div class="stat-box"><h4>2nd</h4><p id="an-2nd">-</p></div></div>
                    <div class="table-container"><table><thead><tr><th>Vs</th><th>M</th><th>WR%</th><th>1st</th><th>2nd</th></tr></thead><tbody id="an-mup-body"></tbody></table></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // --- FIREBASE CONFIG ---
    const firebaseConfig = {
        apiKey: "AIzaSyCLoFyNXaHvtbnCfH40o8qqwjy0RO95NgQ",
        authDomain: "optcg-tracker-225de.firebaseapp.com",
        projectId: "optcg-tracker-225de",
        storageBucket: "optcg-tracker-225de.firebasestorage.app",
        messagingSenderId: "397158081205",
        appId: "1:397158081205:web:8d5b5385df720d1aaad4fc",
        databaseURL: "https://optcg-tracker-225de-default-rtdb.europe-west1.firebasedatabase.app"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentFormat = 'standard';
    let currentMainTab = 'insert';
    let selectedLeaderAn = null;
    let matches = [];

    // --- SICUREZZA ---
    function validate() {
        const val = document.getElementById('psw-field').value;
        const saved = localStorage.getItem('master_key');
        if(!saved) {
            if(val.length < 4) return alert("Minimo 4 caratteri");
            localStorage.setItem('master_key', val);
            showApp();
        } else if(val === saved) {
            showApp();
        } else { alert("Password errata!"); }
    }

    function doLogout() { sessionStorage.removeItem('auth_ok'); location.reload(); }

    function showApp() {
        sessionStorage.setItem('auth_ok', 'true');
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        updateLeaderSelects();
        startSync();
    }

    // --- SINCRONIZZAZIONE ---
    function startSync() {
        document.getElementById('sync-status').innerText = "Connessione al Cloud...";
        db.ref('matches').on('value', (snapshot) => {
            const data = snapshot.val();
            matches = data ? Object.values(data) : [];
            refresh();
            document.getElementById('sync-status').innerText = "Cloud Sincronizzato ✓";
        });
    }

    function saveMatch() {
        const match = {
            p1: document.getElementById('deck1').value,
            p2: document.getElementById('deck2').value,
            t1: document.getElementById('turn').value,
            r1: document.getElementById('result').value,
            format: currentFormat,
            id: Date.now()
        };
        db.ref('matches').push(match).then(() => alert("Salvato nel Cloud!"));
    }

    function resetData() { if(confirm("Cancellare tutti i dati dal Cloud?")) db.ref('matches').remove(); }

    // --- LOGICA UI (TUA ORIGINALE) ---
    const allLeaders = ["Edward.Newgate (OP02-001)", "Portgas.D.Ace (OP03-001)", "Shanks (OP09-001)", "Trafalgar Law (ST10-001)", "Enel (OP05-098)", "Rob Lucci (OP07-079)", "Charlotte Katakuri (OP03-099)", "Bonney (OP07-019)", "Boa Hancock (OP07-038)", "Nami (OP03-040)", "Monkey.D.Luffy (OP13-001)"].sort();
    
    function updateLeaderSelects() {
        document.querySelectorAll('.leader-select').forEach(s => {
            s.innerHTML = '';
            allLeaders.forEach(l => s.add(new Option(l, l)));
        });
        const side = document.getElementById('analysis-list');
        side.innerHTML = '';
        allLeaders.forEach(l => {
            let d = document.createElement('div'); d.className = 'leader-item'; d.innerText = l;
            d.onclick = () => selectAn(l, d); side.appendChild(d);
        });
    }

    function setMainTab(id, btn) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
        currentMainTab = id;
        refresh();
    }

    function setFormat(f, btn) {
        currentFormat = f;
        document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('formato-label').innerText = "MODALITÀ: " + f.toUpperCase();
        refresh();
    }

    function getStats() {
        let s = {};
        matches.filter(m => m.format === currentFormat).forEach(m => {
            const proc = (l, o, t, r) => {
                if(!s[l]) s[l] = { w:0, l:0, w1:0, l1:0, w2:0, l2:0, mu:{} };
                const win = r === 'Win'; win ? s[l].w++ : s[l].l++;
                if(t === '1st') win ? s[l].w1++ : s[l].l1++; else win ? s[l].w2++ : s[l].l2++;
                if(!s[l].mu[o]) s[l].mu[o] = { w:0, l:0, w1:0, l1:0, w2:0, l2:0 };
                win ? s[l].mu[o].w++ : s[l].mu[o].l++;
            };
            proc(m.p1, m.p2, m.t1, m.r1);
            proc(m.p2, m.p1, (m.t1==='1st'?'2nd':'1st'), (m.r1==='Win'?'Loss':'Win'));
        });
        return s;
    }

    function refresh() {
        const s = getStats();
        if(currentMainTab === 'stats') {
            const sB = document.getElementById('statsBody'); sB.innerHTML = '';
            Object.entries(s).forEach(([n,d])=>{
                const tot=d.w+d.l; const wr=(d.w/tot)*100;
                sB.innerHTML += `<tr><td><b>${n}</b></td><td>${d.w}-${d.l}</td><td class="${wr>=50?'wr-high':'wr-low'}">${wr.toFixed(1)}%</td><td>${(d.w1/(d.w1+d.l1)*100||0).toFixed(0)}%</td><td>${(d.w2/(d.w2+d.l2)*100||0).toFixed(0)}%</td></tr>`;
            });
        }
    }

    function selectAn(n, el) { selectedLeaderAn = n; document.querySelectorAll('.leader-item').forEach(i => i.classList.remove('selected')); el.classList.add('selected'); refresh(); }

    window.onload = () => { if(sessionStorage.getItem('auth_ok') === 'true') showApp(); };
</script>
</body>
</html>
