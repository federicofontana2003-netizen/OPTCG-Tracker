<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPTCG LOCK</title>
    <style>
        :root { --primary: #c62828; --gold: #f59e0b; --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; }
        body { font-family: sans-serif; margin: 0; background: var(--bg); color: var(--text); }
        
        /* SCHERMATA BLOCCO FORZATA */
        #guard-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; align-items: center; justify-content: center;
            z-index: 99999; flex-direction: column; text-align: center;
        }
        .guard-box { background: var(--card); padding: 40px; border-radius: 20px; border: 2px solid var(--primary); }
        input { padding: 15px; border-radius: 8px; border: none; width: 200px; font-size: 1.2rem; text-align: center; margin: 20px 0; }
        button { padding: 15px 30px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        #main-app { display: none; padding: 20px; }
    </style>
</head>
<body>

<div id="guard-overlay">
    <div class="guard-box">
        <h1 id="status-txt" style="color: var(--gold);">SISTEMA PROTETTO</h1>
        <p id="desc-txt">Inserisci password per accedere</p>
        <input type="password" id="psw-input" placeholder="****">
        <br>
        <button onclick="unlock()">ACCEDI</button>
    </div>
</div>

<div id="main-app">
    <h1 style="color:var(--gold)">Benvenuto nel tuo Cloud</h1>
    <p>Se vedi questa scritta, il sistema è sbloccato.</p>
    <button onclick="localStorage.removeItem('my_secure_psw'); location.reload();" style="background:#444">RESET PASSWORD</button>
    
    <hr>
    <div id="debug-info">Accesso eseguito correttamente.</div>
</div>

<script>
    // Forza il controllo all'avvio
    const savedPsw = localStorage.getItem('my_secure_psw');
    
    if(!savedPsw) {
        document.getElementById('status-txt').innerText = "PRIMA CONFIGURAZIONE";
        document.getElementById('desc-txt').innerText = "Scegli una password per il tuo cloud.";
    }

    function unlock() {
        const input = document.getElementById('psw-input').value;
        const currentStored = localStorage.getItem('my_secure_psw');

        if(!currentStored) {
            // Caso: Prima configurazione
            if(input.length < 3) return alert("Password troppo corta!");
            localStorage.setItem('my_secure_psw', input);
            alert("Password impostata! Non dimenticarla.");
            enter();
        } else {
            // Caso: Login normale
            if(input === currentStored) {
                enter();
            } else {
                alert("Password sbagliata!");
            }
        }
    }

    function enter() {
        document.getElementById('guard-overlay').style.display = 'none';
        document.getElementById('main-app').style.display = 'block';
    }
</script>
</body>
</html>
