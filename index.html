<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPTCG ANALYTICS</title>
    <style>
        :root { --primary: #c62828; --gold: #f59e0b; --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --border: #334155; }
        body { font-family: sans-serif; margin: 0; background: var(--bg); color: var(--text); }
        
        .header { background: var(--primary); padding: 15px; text-align: center; border-bottom: 4px solid var(--gold); }
        .container { max-width: 1100px; margin: auto; padding: 15px; }

        .main-tabs { display: flex; gap: 5px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 15px; border: none; background: #334155; color: white; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .tab-btn.active { background: var(--gold); color: black; }

        .format-bar { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; }
        .format-btn { padding: 10px 20px; border: 1px solid var(--border); background: #1e293b; color: white; cursor: pointer; border-radius: 4px; }
        .format-btn.active { border-color: var(--gold); color: var(--gold); background: #0b1120; }

        .page { display: none; }
        .page.active { display: block; }

        .card { background: var(--card); padding: 20px; border-radius: 8px; border: 1px solid var(--border); }
        select, input { width: 100%; padding: 12px; margin: 10px 0; background: #0b1120; color: white; border: 1px solid var(--border); box-sizing: border-box; }
        .btn-save { background: var(--primary); color: white; border: none; padding: 18px; width: 100%; font-weight: bold; cursor: pointer; font-size: 1rem; }

        table { width: 100%; border-collapse: collapse; background: #0b1120; margin-top: 10px; }
        th, td { padding: 12px; border: 1px solid var(--border); text-align: left; }
        th { background: #1e293b; color: var(--gold); }

        /* ANALISI LEADER SIDEBAR */
        .analysis-container { display: grid; grid-template-columns: 280px 1fr; gap: 15px; }
        .sidebar { background: #0b1120; height: 550px; overflow-y: auto; border: 1px solid var(--border); border-radius: 4px; }
        .leader-row { padding: 10px 15px; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 0.85rem; }
        .leader-row:hover { background: var(--primary); }
        .leader-row.selected { background: var(--gold); color: black; font-weight: bold; }
        
        .stat-banner { background: var(--card); padding: 15px; border-radius: 4px; margin-bottom: 15px; border-left: 5px solid var(--gold); }
    </style>
</head>
<body>

<div class="header"><h1>OPTCG ANALYTICS</h1></div>

<div class="container">
    <div class="main-tabs">
        <button class="tab-btn active" onclick="showPage('insert', this)">INSERISCI</button>
        <button class="tab-btn" onclick="showPage('db', this)">DATABASE</button>
        <button class="tab-btn" onclick="showPage('rank', this)">RANKING</button>
        <button class="tab-btn" onclick="showPage('analysis', this)">ANALISI</button>
    </div>

    <div class="format-bar">
        <button class="format-btn active" onclick="changeFormat('std', this)">STANDARD</button>
        <button class="format-btn" onclick="changeFormat('etc', this)">ETERNO</button>
    </div>

    <div id="insert" class="page active">
        <div class="card">
            <label>Tuo Leader</label><select id="p1" class="leader-select"></select>
            <label>Leader Avversario</label><select id="p2" class="leader-select"></select>
            <div style="display:flex; gap:10px;">
                <select id="turn"><option value="1st">1st Turn</option><option value="2nd">2nd Turn</option></select>
                <select id="result"><option value="Win">Vittoria</option><option value="Loss">Sconfitta</option></select>
            </div>
            <button class="btn-save" onclick="saveMatch()">SALVA PARTITA</button>
        </div>
    </div>

    <div id="db" class="page">
        <table>
            <thead><tr><th>Leader</th><th>W-L</th><th>WinRate</th><th>1st WR</th><th>2nd WR</th></tr></thead>
            <tbody id="db-body"></tbody>
        </table>
    </div>

    <div id="rank" class="page">
        <table>
            <thead><tr><th>#</th><th>Leader</th><th>Match Totali</th><th>Win Rate %</th></tr></thead>
            <tbody id="rank-body"></tbody>
        </table>
    </div>

    <div id="analysis" class="page">
        <div class="analysis-container">
            <div class="sidebar" id="leader-list"></div>
            <div class="content">
                <div id="an-header" class="stat-banner">Seleziona un leader per l'analisi dettagliata</div>
                <table>
                    <thead><tr><th>Matchup VS</th><th>M</th><th>WR%</th><th>1st</th><th>2nd</th></tr></thead>
                    <tbody id="an-body"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    let matches = JSON.parse(localStorage.getItem('optcg_data')) || [];
    let curFormat = 'std';
    let selLeader = null;

    const leadersStandard = ["Shanks (OP09-001)", "Rob Lucci (OP07-079)", "Enel (OP05-098)", "Bonney (OP07-019)", "Blackbeard (OP09-081)", "Boa Hancock (OP07-038)", "Luffy (OP05-060)"].sort();
    const leadersEterno = ["Edward.Newgate (OP02-001)", "Portgas.D.Ace (OP03-001)", "Trafalgar Law (ST10-001)", "Doflamingo (OP01-060)", "Katakuri (OP03-099)", "Zoro (OP01-001)", "Whitebeard (OP02-001)"].sort();

    function showPage(id, btn) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
    }

    function changeFormat(f, btn) {
        curFormat = f;
        document.querySelectorAll('.format-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selLeader = null;
        initUI();
        render();
    }

    function initUI() {
        const list = curFormat === 'std' ? leadersStandard : leadersEterno;
        const selects = document.querySelectorAll('.leader-select');
        const sidebar = document.getElementById('leader-list');
        
        selects.forEach(s => {
            s.innerHTML = '';
            list.forEach(l => s.add(new Option(l, l)));
        });

        sidebar.innerHTML = '';
        list.forEach(l => {
            let d = document.createElement('div');
            d.className = 'leader-row' + (selLeader === l ? ' selected' : '');
            d.innerText = l;
            d.onclick = () => { selLeader = l; render(); };
            sidebar.appendChild(d);
        });
    }

    function saveMatch() {
        const m = {
            p1: document.getElementById('p1').value,
            p2: document.getElementById('p2').value,
            t: document.getElementById('turn').value,
            r: document.getElementById('result').value,
            f: curFormat
        };
        matches.push(m);
        localStorage.setItem('optcg_data', JSON.stringify(matches));
        alert("Partita salvata!");
        render();
    }

    function render() {
        const fData = matches.filter(m => m.f === curFormat);
        let s = {};

        fData.forEach(m => {
            const process = (l, o, r, t) => {
                if(!s[l]) s[l] = {w:0, l:0, w1:0, l1:0, w2:0, l2:0, mu:{}};
                r === 'Win' ? s[l].w++ : s[l].l++;
                if(t === '1st') r === 'Win' ? s[l].w1++ : s[l].l1++;
                else r === 'Win' ? s[l].w2++ : s[l].l2++;
                
                if(!s[l].mu[o]) s[l].mu[o] = {w:0, l:0, w1:0, l1:0, w2:0, l2:0};
                r === 'Win' ? s[l].mu[o].w++ : s[l].mu[o].l++;
                if(t === '1st') r === 'Win' ? s[l].mu[o].w1++ : s[l].mu[o].l1++;
                else r === 'Win' ? s[l].mu[o].w2++ : s[l].mu[o].l2++;
            };
            process(m.p1, m.p2, m.r, m.t);
            process(m.p2, m.p1, (m.r === 'Win' ? 'Loss' : 'Win'), (m.t === '1st' ? '2nd' : '1st'));
        });

        // DB Render
        const dbBody = document.getElementById('db-body');
        dbBody.innerHTML = '';
        Object.entries(s).forEach(([n, d]) => {
            dbBody.innerHTML += `<tr><td>${n}</td><td>${d.w}-${d.l}</td><td>${(d.w/(d.w+d.l)*100).toFixed(1)}%</td><td>${(d.w1/(d.w1+d.l1)*100||0).toFixed(0)}%</td><td>${(d.w2/(d.w2+d.l2)*100||0).toFixed(0)}%</td></tr>`;
        });

        // Rank Render
        const rBody = document.getElementById('rank-body');
        rBody.innerHTML = '';
        Object.entries(s).sort((a,b) => (b[1].w/(b[1].w+b[1].l)) - (a[1].w/(a[1].w+a[1].l))).slice(0,10).forEach(([n, d], i) => {
            rBody.innerHTML += `<tr><td>${i+1}</td><td>${n}</td><td>${d.w+d.l}</td><td>${(d.w/(d.w+d.l)*100).toFixed(1)}%</td></tr>`;
        });

        // Analisi Render
        const sidebar = document.getElementById('leader-list');
        const rows = sidebar.querySelectorAll('.leader-row');
        rows.forEach(r => r.classList.toggle('selected', r.innerText === selLeader));

        if(selLeader && s[selLeader]) {
            const l = s[selLeader];
            document.getElementById('an-header').innerHTML = `<h3>${selLeader}</h3><p>Win Rate Totale: ${(l.w/(l.w+l.l)*100).toFixed(1)}% (${l.w}W - ${l.l}L)</p>`;
            const anBody = document.getElementById('an-body');
            anBody.innerHTML = '';
            Object.entries(l.mu).forEach(([opp, d]) => {
                anBody.innerHTML += `<tr><td>${opp}</td><td>${d.w+d.l}</td><td>${(d.w/(d.w+d.l)*100).toFixed(1)}%</td><td>${d.w1}-${d.l1}</td><td>${d.w2}-${d.l2}</td></tr>`;
            });
        }
    }

    initUI();
    render();
</script>

</body>
</html>
